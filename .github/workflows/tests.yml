# Runs the automated tests on GitHub for every push and pull request. No hardware or secrets needed.
name: tests
on: [push, pull_request]
jobs:
  web-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scheduled-session server checks
        run: node tools/schedule_test.js
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries (camera, modem and model libraries are stubbed by the tests)
        run: pip install numpy opencv-python-headless
      - name: Prototype tests
        working-directory: prototype
        run: python -m unittest discover -s tests -v
